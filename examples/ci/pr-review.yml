name: PR Review (AI)

# ШАБЛОН для репозитория-потребителя (скопируйте в .github/workflows/ и поправьте под себя).
# Авто код-ревью PR: Ollama Cloud (MoA specialists → aggregator → verifier) + Graphify blast-radius.
# Ревью постится как event=COMMENT, но БЛОКИРУЕТ merge через exit 1 на консенсус-блокерах
# critical/major (red required-check). Чтобы блок был обязательным — сделать этот job required-check.
# Инфра-сбои по умолчанию не блокируют, но полный LLM-аутедж блокирует merge при REVIEW_LLM_REQUIRED=1 (default).
# Движок — внешний пакет ai-reviewer, пин версии лежит в ops/ai-reviewer-ref (см. docs/integration.md).
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Номер PR для ручного ревью'
        required: true

# Новый push в PR отменяет прошлый прогон ревью (не жжём токены на гонке).
concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Только read. Write здесь был бы опасен: prescan запускает eslint на коде PR, а flat-config
  # `app/eslint.config.js` — исполняемый JS из чекаута PR. Отмена гейтов живёт в ci.yml,
  # в job'е без кода PR.
  actions: read            # артефакты/метрики (workflow-runs API)

jobs:
  review:
    name: AI code review
    # SELF_HOSTED_CI=1 → hermes-review-1; отдельный runner не блокирует CI build.
    runs-on: ${{ vars.SELF_HOSTED_CI == '1' && fromJSON('["self-hosted", "linux", "review"]') || 'ubuntu-latest' }}
    timeout-minutes: 25   # мелкие чанки → больше (модель×чанк)-вызовов на крупных PR; запас под gigant-PR
    # Пропускаем черновики (кроме явного ready_for_review через тип события) и PR от ботов.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # полный граф; теги не нужны, но дешевле не урезать

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # venv кэшируется по пину версии — на повторных прогонах pip install пропускается.
      # .graphify/ gitignored и в CI отсутствует → ставим graphifyy из PyPI (пин версии), а не из
      # локального wheel. Нужны только update/affected (без fastembed/scipy — это extras для sem).
      # v2: инвалидирует venv с битым shebang после restore (self-hosted path drift).
      - name: Cache graphify venv
        id: gfcache
        uses: actions/cache@v6
        with:
          path: .graphify/venv
          key: gf-venv-${{ runner.os }}-py311-graphifyy-0.9.87-v1

      - name: Install graphify (pinned, from PyPI)
        run: |
          install_graphify() {
            python -m venv .graphify/venv
            .graphify/venv/bin/pip install --quiet --disable-pip-version-check graphifyy==0.9.87
          }
          if [ -x .graphify/venv/bin/graphify ] && .graphify/venv/bin/graphify --version >/dev/null 2>&1; then
            echo "graphify venv OK: $(.graphify/venv/bin/graphify --version 2>&1 | head -1)"
          else
            if [ -d .graphify/venv ]; then
              echo "graphify venv из кэша неработоспособен (shebang/path) — пересоздаём"
              rm -rf .graphify/venv
            fi
            install_graphify
          fi

      # R6: eslint prescan + код-граф — независимы, гоняем параллельно (~15–40с экономии).
      # continue-on-error на шаге сборки: упавший граф ловит сам ревью — с REVIEW_BLAST_REQUIRED=1
      # он блокирует merge с диагнозом в sticky, а не роняет job без объяснения.
      - name: Install app deps + build code graph (parallel)
        continue-on-error: true
        env:
          GRAPHIFY_OUT: .graphify/graphify-out
          GRAPHIFY_MAX_WORKERS: '4'
          GRAPHIFY_NO_TIPS: '1'
        run: |
          set -e
          # --ignore-scripts: postinstall зависимостей ИЗ КОДА PR не исполняем — иначе вредоносный
          # пакет, добавленный в PR, закрепился бы на персистентном self-hosted раннере / отравил кэш.
          # eslint/ast-grep prescan — чистый JS, lifecycle-скрипты зависимостей ему не нужны.
          (cd app && npm ci --ignore-scripts --fund=false --audit=false) &
          NPM_PID=$!
          if .graphify/venv/bin/graphify --version >/dev/null 2>&1; then
            .graphify/venv/bin/graphify update app --force || true
          else
            echo "graphify недоступен — пропускаем build code graph"
          fi
          wait "$NPM_PID"

      # ЗАЩИТА ОТ pwn-request: движок берём из ОТДЕЛЬНОГО репозитория по пину, а сам пин читаем
      # из base-ветки — код из чекаута PR с секретами в env не исполняется никогда. PR, правящий
      # ops/ai-reviewer-ref, поменяет движок только ПОСЛЕ мержа (и это видно в диффе).
      - name: Read pinned engine ref
        id: pin
        env:
          BASE_REF: ${{ github.base_ref }}   # через env, НЕ инлайнить ${{…}} в run: (script-injection)
        run: |
          BASE_REF="${BASE_REF:-main}"   # workflow_dispatch: base_ref пуст — пин берём из main
          [[ "$BASE_REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "invalid BASE_REF"; exit 1; }
          REF="$(git show "origin/$BASE_REF:ops/ai-reviewer-ref" 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$REF" ]; then
            echo "→ пин ops/ai-reviewer-ref отсутствует в origin/$BASE_REF (bootstrap-PR) — ревью пропускаем"
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "invalid engine ref: $REF"; exit 1; }
          echo "→ движок ai-reviewer@$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned AI review engine
        if: steps.pin.outputs.ref != ''
        uses: actions/checkout@v7
        with:
          repository: Orange-hanter/ai-reviewer
          ref: ${{ steps.pin.outputs.ref }}
          path: .ai-reviewer-engine

      # Готовые Rust-бинари движка (RFC 20): основная реализация каскада LLM, промптов и гейта.
      # Архив берётся из релиза ТОГО ЖЕ тега, что и движок. Ставится, только если прошёл
      # sha256 (целостность) И build provenance (происхождение): attestation подписана
      # workflow release-binaries репозитория движка, подменённый в релизе архив её не имеет.
      # Пин не тег, релиз без архива, платформа без сборки, нет gh — предупреждение и
      # deprecated JS-копии (инфра-сбой merge не блокирует). Проверка не прошла — бинари не
      # ставятся вовсе: непроверенный код с секретами прогона не исполняется.
      - name: Download engine binaries
        if: steps.pin.outputs.ref != ''
        env:
          REF: ${{ steps.pin.outputs.ref }}   # уже провалидирован шагом pin
          GH_TOKEN: ${{ github.token }}       # gh attestation verify (публичный репозиторий движка)
        run: |
          set -uo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) T=linux-x64 ;;
            Linux-aarch64|Linux-arm64) T=linux-arm64 ;;
            Darwin-arm64) T=darwin-arm64 ;;
            *) echo "::warning::нет готовых бинарей ai-reviewer для $(uname -sm) — движок на JS-копиях"; exit 0 ;;
          esac
          NAME="ai-reviewer-bins-$T.tar.gz"
          URL="https://github.com/Orange-hanter/ai-reviewer/releases/download/$REF"
          D="$RUNNER_TEMP/ai-reviewer-bins"
          mkdir -p "$D"
          if ! curl -fsSL --retry 3 -o "$D/$NAME" "$URL/$NAME" || ! curl -fsSL --retry 3 -o "$D/$NAME.sha256" "$URL/$NAME.sha256"; then
            echo "::warning::архива $NAME для ai-reviewer@$REF нет (пин не тег релиза?) — движок на JS-копиях"
            exit 0
          fi
          if ! (cd "$D" && sha256sum -c "$NAME.sha256"); then
            echo "::error::sha256 архива $NAME не совпал — бинари не установлены, движок на JS-копиях"
            exit 0
          fi
          # gh нужен для проверки provenance. На self-hosted раннере его часто нет — тогда
          # берём пиненную версию из релиза cli/cli, сверенную по sha256, зашитому ЗДЕСЬ
          # (не скачанному рядом). Обновляя GH_VER, обнови и обе суммы.
          GH="$(command -v gh || true)"
          if [ -z "$GH" ]; then
            GH_VER=2.102.0
            case "$T" in
              linux-x64) GH_ARCH=linux_amd64; GH_SHA=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 ;;
              linux-arm64) GH_ARCH=linux_arm64; GH_SHA=7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484 ;;
              *) GH_ARCH= ;;
            esac
            if [ -n "$GH_ARCH" ] \
               && curl -fsSL --retry 3 -o "$D/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VER/gh_${GH_VER}_${GH_ARCH}.tar.gz" \
               && echo "$GH_SHA  $D/gh.tar.gz" | sha256sum -c - >/dev/null \
               && tar -xzf "$D/gh.tar.gz" -C "$D"; then
              GH="$D/gh_${GH_VER}_${GH_ARCH}/bin/gh"
              echo "→ gh на раннере нет — взят gh $GH_VER из релиза cli/cli (sha256 сверен)"
            fi
          fi
          if [ -z "$GH" ]; then
            echo "::warning::нет gh CLI — provenance архива не проверить, бинари не установлены, движок на JS-копиях"
            exit 0
          fi
          # source-ref: подпись должна прийти из сборки ИМЕННО этого тега. Запуск того же
          # workflow с ветки (с правленым файлом workflow) даёт attestation с ref ветки — отказ.
          if ! "$GH" attestation verify "$D/$NAME" --repo Orange-hanter/ai-reviewer \
               --signer-workflow Orange-hanter/ai-reviewer/.github/workflows/release-binaries.yml \
               --source-ref "refs/tags/$REF" --deny-self-hosted-runners; then
            echo "::error::provenance архива $NAME не подтверждена — бинари не установлены, движок на JS-копиях"
            exit 0
          fi
          mkdir -p .ai-reviewer-engine/rust/bin
          tar -xzf "$D/$NAME" -C .ai-reviewer-engine/rust/bin
          echo "→ бинари ai-reviewer@$REF ($T) установлены"

      # Всё, что движок читает как настройку гейта, — из base-ветки: автор PR не может своим PR
      # поменять ни промпт (repoRulesFile, AGENTS.md), ни FP-паттерны, снимающие находки, ни
      # правила ast-grep, ни список путей, которые не уходят моделям (layout.reviewSkip).
      # Движок с REVIEW_BASE_REF и сам читает эти файлы из base (docs/profiles.md «Доверие»);
      # шаг — защита для пинов старше и для инструментов, читающих диск. Файла нет в base —
      # он удаляется: копия из PR не должна остаться. Пути — из профиля base, не из PR.
      - name: Take review profile from base branch
        if: steps.pin.outputs.ref != ''
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}   # тот же коммит, что REVIEW_BASE_REF ниже
          PROFILE: ops/ai-review/profile.json
        run: |
          BASE_REF="${BASE_REF:-main}"
          [[ "$BASE_REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "invalid BASE_REF"; exit 1; }
          if [ -n "$BASE_SHA" ]; then
            [[ "$BASE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || { echo "invalid BASE_SHA"; exit 1; }
            BASE="$BASE_SHA"
          else
            BASE="refs/remotes/origin/$BASE_REF"   # workflow_dispatch: события PR нет
          fi
          safe() { [[ "$1" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ && "$1" != *..* ]] || { echo "::error::небезопасный путь из профиля: $1"; exit 1; }; }
          restore_file() {
            safe "$1"
            mkdir -p "$(dirname "$1")"
            git show "$BASE:$1" > "$1" 2>/dev/null || { rm -f "$1"; echo "→ $1 нет в $BASE"; }
          }
          restore_dir() {   # целиком: добавленное в PR удаляется, удалённое — возвращается
            safe "$1"
            rm -rf "$1"
            if [ -n "$(git ls-tree -d --name-only "$BASE" -- "$1")" ]; then
              git checkout "$BASE" -- "$1"
            else
              echo "→ $1/ нет в $BASE"
            fi
          }
          restore_file "$PROFILE"
          PDIR="$(dirname "$PROFILE")"
          for f in AGENTS.md agents.md "$PDIR/AGENTS.md" "$PDIR/agents.md"; do restore_file "$f"; done
          if [ -f "$PROFILE" ]; then
            RULES="$(jq -r '.repoRulesFile // empty' "$PROFILE")"   # от каталога профиля
            if [ -n "$RULES" ]; then restore_file "$PDIR/$RULES"; fi
            FP="$(jq -r '.paths.fpPatterns // empty' "$PROFILE")"
            if [ -n "$FP" ]; then restore_file "$FP"; fi
            SG="$(jq -r '.paths.astgrepConfig // empty' "$PROFILE")"
            if [ -n "$SG" ]; then
              # sgconfig и его ruleDirs/utilDirs — каталог конфига целиком (в корне — только файл)
              if [ "$(dirname "$SG")" = "." ]; then restore_file "$SG"; else restore_dir "$(dirname "$SG")"; fi
            fi
          fi

      # БЕЗ continue-on-error: скрипт выходит 1 ТОЛЬКО на находках critical/major (REVIEW_BLOCK_ON)
      # внутри скрипта (die/throw), джоб зелёный, merge не блокируется.
      - name: Run AI review
        if: steps.pin.outputs.ref != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          REVIEW_MODE: moa
          MOA_REFERENCE_MODELS: kimi-k2.7-code,glm-5.3,glm-5.3-flash
          MOA_SPECIALIST_MODELS: security:glm-5.3-flash,correctness:kimi-k2.7-code,architecture:glm-5.3
          MOA_AGGREGATOR: minimax-m3
          MOA_REFERENCE_TEMPERATURE: '0.3'   # меньше находок, плотнее по существу (см. docs/model-tuning.md движка)
          MOA_AGGREGATOR_TEMPERATURE: '0.4'
          OLLAMA_MODELS_FALLBACK: deepseek-v4.1-flash
          REVIEW_AUTO_TRIAGE: '1'
          REVIEW_INLINE_ON: critical,major
          REVIEW_BLOCK_ON: critical,major
          REVIEW_BLOCK_SINGLE: critical
          REVIEW_CONSENSUS: '1'
          # REVIEW_LLM_REQUIRED не указываем: default в config.mjs = '1' (fail-closed).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPHIFY_BIN: .graphify/venv/bin/graphify
          # graphify update app --force пишет в app/.graphify/graphify-out (аудит §3.1:
          # раньше GRAPH указывал в корень — blast-radius был мёртв, 0/20 symbols).
          GRAPH: app/.graphify/graphify-out/graph.json
          GRAPHIFY_REPORT: app/.graphify/graphify-out/GRAPH_REPORT.md
          REVIEW_BLAST_REQUIRED: '1'       # нет графа / graphify недоступен → exit 1 до LLM (0 = fail-open)
          REVIEW_CONFIDENCE_MIN: '0.8'
          REVIEW_VERIFIER: '1'             # R3: второй проход verifier для critical/major (0 = выкл.)
          REVIEW_VERIFIER_MODEL: deepseek-v4-pro
          REVIEW_VERIFIER_STRICT: '1'      # блок требует verdict verifier; нет verdict → minor (0 = fail-open)
          REVIEW_ROUTER: '1'               # R4: skip/light/full по типу diff (0 = всегда full)
          REVIEW_PRESCAN: '1'              # R6: eslint + ast-grep на changed files (нужен app/node_modules)
          REVIEW_PRESCAN_ASTGREP: '1'      # R6+: ast-grep anti-patterns (fail-open без @ast-grep/cli)
          REVIEW_OBSERVABILITY: '1'        # R7: JSONL run log (fail-open)
          REVIEW_EXPORT: '1'               # R9: JSON + SARIF artifact (fail-open)
          REVIEW_APP_DIR: app
          # Профиль проекта: маркеры комментариев, правила репозитория для промпта, раскладка
          # каталогов, scope ast-grep правил и пути feedback (см. docs/profiles.md движка).
          REVIEW_PROFILE: ops/ai-review/profile.json
          REVIEW_PROFILE_TRUSTED: '1'      # профиль и его вход — из base (шаг выше + REVIEW_BASE_REF) → reviewSkip применяется
          # Только SHA коммита или полный ref (refs/remotes/…, refs/heads/…), без него или с
          # коротким именем (origin/main) REVIEW_PROFILE_TRUSTED снимается.
          REVIEW_BASE_REF: ${{ github.event.pull_request.base.sha || format('refs/remotes/origin/{0}', github.base_ref || 'main') }}
          # REVIEW_LOCKFILE_REGISTRIES: npm.pkg.github.com   # реестры сверх npmjs/yarnpkg для проверки lockfile
          REVIEW_CHUNK_BYTES: '56000'       # крупнее чанк → меньше LLM-вызовов (баланс recall/скорость)
          REVIEW_CONCURRENCY: '10'            # параллельных chunk-pipeline (3 specialists + aggregator)
          REVIEW_MAX_CHUNKS: '40'           # потолок числа чанков (гигантский PR → чанки крупнее, влезаем в timeout)
          REVIEW_LLM_TIMEOUT_MS: '240000'   # таймаут одной попытки LLM (было 900с: ретраи взрывали 25-мин job)
          REVIEW_TIME_BUDGET_MIN: '20'      # дедлайн LLM-фазы → частичный отчёт вместо убийства раннером
          REVIEW_PROVIDER_CONCURRENCY: '12' # глобальный cap LLM-вызовов + AIMD при 429 (бэклог #5)
          REVIEW_PROVIDER_PER_MODEL: '6'    # cap одновременных вызовов на модель
        run: node .ai-reviewer-engine/bin/pr-review.mjs

      - name: Upload review observability log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-review-observability-${{ github.event.pull_request.number || inputs.pr_number }}
          path: .graphify/graphify-out/observability/pr-review-runs.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload review machine-readable export
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-review-export-${{ github.event.pull_request.number || inputs.pr_number }}
          path: .graphify/graphify-out/review-export/
          if-no-files-found: ignore
          retention-days: 30
