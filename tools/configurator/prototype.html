<meta charset="utf-8">
<title>Конфигуратор ai-reviewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Раскладка: рельс шагов слева, шаг в центре, панель последствий справа (схема, замечания, стоимость). */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #f6f8fa; --ink: #17202b; --muted: #5a6575; --line: #d6dce4;
  --accent: #1d6a73; --accent-ink: #ffffff; --accent-soft: #d9eced;
  --ok: #1d7a45; --ok-soft: #dcf0e3; --warn: #9a5800; --warn-soft: #fbeed8; --err: #b0261d; --err-soft: #f9dfdc;
  --add: #e3f3e8; --del: #fbe4e1;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #151c25; --sunk: #111820; --ink: #e2e8ef; --muted: #93a0b0; --line: #283241;
  --accent: #56b4bd; --accent-ink: #08191b; --accent-soft: #163a3e;
  --ok: #57c486; --ok-soft: #12301f; --warn: #e5a443; --warn-soft: #36270f; --err: #f2766c; --err-soft: #3a1714;
  --add: #12301f; --del: #3a1714; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c25; --sunk: #111820; --ink: #e2e8ef; --muted: #93a0b0; --line: #283241;
  --accent: #56b4bd; --accent-ink: #08191b; --accent-soft: #163a3e;
  --ok: #57c486; --ok-soft: #12301f; --warn: #e5a443; --warn-soft: #36270f; --err: #f2766c; --err-soft: #3a1714;
  --add: #12301f; --del: #3a1714; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--f-body); }
code, .mono { font-family: var(--f-mono); font-size: 12.5px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
p { margin: 0 }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface) }
.top h1 { font-size: 19px; letter-spacing: .01em }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
  font-size: 12px; color: var(--muted); background: var(--sunk); white-space: nowrap }
.chip.proto { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); white-space: normal }
.top .spacer { flex: 1 }

.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr) 340px; align-items: start; min-height: calc(100vh - 60px) }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); padding: 14px 10px 24px max(10px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--line); max-height: 100vh; overflow-y: auto }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.rail button { width: 100%; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; text-align: left;
  padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; color: var(--ink) }
.rail button:hover { background: var(--sunk) }
.rail button[aria-current="step"] { background: var(--accent-soft) }
.rail .n { font: 500 11px var(--f-mono); color: var(--muted); text-align: right }
.rail .t { font-size: 13.5px; line-height: 1.3 }
.rail .t small { display: block; font: 11px var(--f-mono); color: var(--muted) }
.rail .b { font: 500 11px var(--f-mono); padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink) }
.rail .b.w { background: var(--warn); color: var(--surface) }
.rail .b.e { background: var(--err); color: var(--surface) }
.rail .grp { font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 8px 4px }

main { min-width: 0; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.stage-head { display: grid; gap: 6px; margin-bottom: 18px; max-width: 760px }
.stage-head .eyebrow { font: 500 12px var(--f-mono); color: var(--accent) }
.stage-head h2 { font-size: 27px }
.stage-head .lead { color: var(--ink); max-width: 68ch; font-size: 15px }
.stage-head .tip { color: var(--muted); max-width: 68ch; font-size: 13.5px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; max-width: 760px }
.card + .card, .card + details, details + .card, details + details { margin-top: 14px }
.card > h3 { font-size: 16px; padding: 14px 18px 0 }
.card > .sub { margin: 4px 18px 0; color: var(--muted); font-size: 13.5px; max-width: 68ch }
.card > .sub + .sub { margin-top: 6px }

.field { display: grid; gap: 6px; padding: 14px 18px; border-top: 1px solid var(--line) }
.card > h3 + .field, .card > .sub + .field { margin-top: 12px }
.field:first-child { border-top: 0 }
.field .fh { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center }
.field .ft { font-weight: 600; font-size: 14.5px; line-height: 1.35 }
.field .desc { font-size: 13.5px; max-width: 68ch; color: var(--ink) }
.field .now { font-size: 13px; color: var(--accent); max-width: 68ch }
.field .now::before { content: "Сейчас: "; font-weight: 600 }
.field .when { font-size: 13px; color: var(--muted); max-width: 68ch }
.field .when b { font-weight: 600; color: var(--ink) }
.field .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--muted) }
.field .meta code { font-size: 11.5px; overflow-wrap: anywhere }
.field .ctl { display: flex; align-items: center; gap: 8px; justify-content: flex-end; min-width: 0; flex-wrap: wrap }
.field.wide .fh { grid-template-columns: minmax(0, 1fr) }
.field.wide .ctl { justify-content: stretch }
.field.wide .ctl > * { flex: 1 }
.field.changed { background: linear-gradient(90deg, var(--accent-soft), transparent 60%) }
.unit { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap }
.tag { font: 500 10.5px var(--f-body); letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap }
.tag.t-gate { border-color: var(--err); color: var(--err) }
.tag.t-cost { border-color: var(--warn); color: var(--warn) }
.tag.t-conv { border-color: var(--accent); color: var(--accent) }
.chg { font: 500 11.5px var(--f-mono); color: var(--accent) }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px }

input[type=text], input[type=number], input[type=password], select, textarea {
  background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0 }
input[type=number] { width: 120px; font-family: var(--f-mono); font-size: 13px }
input[type=text].mono, textarea.mono { font-family: var(--f-mono); font-size: 12.5px }
textarea { width: 100%; min-height: 84px; resize: vertical }
input.bad, textarea.bad { border-color: var(--err); background: var(--err-soft) }

.sw { position: relative; width: 40px; height: 22px; flex: none }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer }
.sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s }
.sw input:checked + span { background: var(--accent) }
.sw input:checked + span::after { transform: translateX(18px) }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.seg button { border: 0; border-left: 1px solid var(--line); background: var(--sunk); padding: 5px 10px; cursor: pointer; font-size: 13px }
.seg button:first-child { border-left: 0 }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.checks { display: flex; flex-wrap: wrap; gap: 6px }
.checks label { display: inline-flex; gap: 5px; align-items: center; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); font-size: 13px; cursor: pointer }

details.expert { max-width: 760px; border: 1px dashed var(--line); border-radius: 8px; background: var(--surface) }
.card + details.expert { margin-top: 14px }
details.expert > summary { cursor: pointer; padding: 12px 18px; font-weight: 500 }
details.expert > summary span { color: var(--muted); font-weight: 400 }
details.expert[open] > summary { border-bottom: 1px solid var(--line) }

.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; padding: 12px 18px 18px }
.choice { display: grid; gap: 6px; align-content: start; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); cursor: pointer }
.choice b { font-family: var(--f-display); font-size: 16px; font-weight: 600 }
.choice span { font-size: 13px; color: var(--muted) }
.choice em { font-style: normal; font-size: 12px; color: var(--ink) }
.choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft) }

.how { margin: 12px 18px 16px; padding: 0 0 0 20px; display: grid; gap: 6px; font-size: 13.5px }
.how li::marker { color: var(--accent); font-weight: 600 }

table.t { width: 100%; border-collapse: collapse; font-size: 13px }
table.t th, table.t td { text-align: left; padding: 9px 18px; border-top: 1px solid var(--line); vertical-align: middle }
table.t th { font-weight: 500; color: var(--muted); font-size: 12px }
table.t td small { display: block; color: var(--muted); font-size: 12px }
.tw { overflow-x: auto }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted) }
.dot.ok { background: var(--ok) } .dot.warn { background: var(--warn) } .dot.err { background: var(--err) }

.nav { display: flex; gap: 10px; margin-top: 20px; max-width: 760px; flex-wrap: wrap; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 500 }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn:disabled { opacity: .45; cursor: not-allowed }

aside { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; border-left: 1px solid var(--line);
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) 30px 16px; display: grid; gap: 22px; min-width: 0 }
aside h3 { font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin-bottom: 4px }
aside .lead { font-size: 12.5px; color: var(--muted); margin-bottom: 10px }
.pipe { list-style: none; margin: 0; padding: 0; display: grid }
.pipe li { position: relative; display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding-bottom: 11px; cursor: pointer }
.pipe li::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px; background: var(--line) }
.pipe li:last-child::before { display: none }
.pipe .node { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); margin-top: 3px; z-index: 1 }
.pipe li.off .node { border-color: var(--line); background: var(--sunk) }
.pipe li.off .pn { color: var(--muted); text-decoration: line-through }
.pipe .pn { font-weight: 600; font-size: 13.5px }
.pipe .pd { font-size: 12px; color: var(--muted); overflow-wrap: anywhere }
.pipe .fm { font: 500 10.5px var(--f-body); margin-left: 6px; padding: 0 5px; border-radius: 3px; white-space: nowrap }
.pipe .fm.closed { background: var(--err-soft); color: var(--err) }
.pipe .fm.open { background: var(--ok-soft); color: var(--ok) }
.rules { display: grid; gap: 6px }
.rule { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; padding: 9px 10px; border-radius: 6px; font-size: 12.5px; background: var(--sunk) }
.rule.warn { background: var(--warn-soft) } .rule.error { background: var(--err-soft) }
.rule .lv { font: 600 10.5px var(--f-body); padding-top: 2px; white-space: nowrap }
.rule.warn .lv { color: var(--warn) } .rule.error .lv { color: var(--err) } .rule.info .lv { color: var(--accent) }
.rule .acts { grid-column: 2; display: flex; gap: 12px; flex-wrap: wrap }
.cost { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: 13px; font-variant-numeric: tabular-nums }
.cost .h { color: var(--muted); font-size: 11.5px }
.cost .v { text-align: right; font-family: var(--f-mono); font-size: 12.5px }
.cost .up { color: var(--warn) } .cost .down { color: var(--ok) }
.note { font-size: 12px; color: var(--muted); margin-top: 8px }

.summary { list-style: none; margin: 10px 0 0; padding: 0 }
.summary li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 9px 18px; border-top: 1px solid var(--line); font-size: 13.5px }
.summary li .w { color: var(--muted); font-size: 12.5px; grid-column: 1 / -1 }
.summary li .ch { font: 12px var(--f-mono); color: var(--accent); text-align: right }
.diff { font: 12.5px/1.55 var(--f-mono); margin: 0; padding: 10px 0; overflow-x: auto; background: var(--sunk); border-top: 1px solid var(--line) }
.diff div { padding: 0 18px; white-space: pre }
.diff .a { background: var(--add) } .diff .d { background: var(--del) } .diff .c { color: var(--muted) }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; max-width: 760px; margin-bottom: -1px }
.tabs button { border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; padding: 6px 12px; background: var(--sunk); cursor: pointer; font-size: 13px }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--accent); font-weight: 600 }
.match { font-size: 12.5px; color: var(--muted) }
.match code { font-size: 11.5px }
.banner { max-width: 760px; padding: 12px 18px; border-radius: 8px; margin-bottom: 14px; font-size: 13.5px }
.banner.ok { background: var(--ok-soft); color: var(--ok) }
.banner.err { background: var(--err-soft); color: var(--err) }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 14px; border-radius: 6px; font-size: 13px; max-width: min(420px, calc(100vw - 32px)) }

@media (max-width: 1180px) {
  .shell { grid-template-columns: 230px minmax(0, 1fr) }
  aside { grid-column: 1 / -1; position: static; max-height: none; border-left: 0; border-top: 1px solid var(--line);
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); padding-left: max(16px, env(safe-area-inset-left, 0px)) }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr) }
  .rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto }
  .rail ol { grid-auto-flow: column; grid-auto-columns: max-content }
  .rail .grp, .rail .t small { display: none }
  .field .fh { grid-template-columns: minmax(0, 1fr) }
  .field .ctl { justify-content: flex-start }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<header class="top">
  <h1>Конфигуратор ai-reviewer</h1>
  <span class="chip" id="hdr-repos"></span>
  <span class="chip" id="hdr-pin"></span>
  <span class="spacer"></span>
  <span class="chip proto">Прототип: данные для примера, ничего не сохраняется</span>
</header>
<div class="shell">
  <nav class="rail" aria-label="Шаги настройки"><ol id="rail"></ol></nav>
  <main id="main"></main>
  <aside id="side"></aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
// ── Схема опций (подмножество будущего schemas/config-options.v1.json) ───────────────
// [ключ, тип, дефолт, шаг, слой (m — основные, e — эксперт, f — feedback), эффекты, название, описание, доп.]
// доп.: on/off — что происходит при вкл./выкл.; when — когда менять; en/enl — значения и их подписи;
//       unit — ms|bytes|lines|min; min/max; fp — входит в отпечаток incremental; fm — fail-closed; since.
const SEV = ['critical', 'major', 'minor', 'nit'];
const SEV_L = {critical: 'critical — дыры и падения', major: 'major — заметные ошибки', minor: 'minor — мелочи', nit: 'nit — стиль'};
const EFFORT = {none: 'не думать', minimal: 'чуть-чуть', low: 'немного', medium: 'средне', high: 'много'};
const RAW = [
  // ── Отбор PR
  ['REVIEW_ROUTER','flag','1','router','m',['cost'],'Разная глубина проверки для разных PR',
   'Перед ревью движок смотрит, что поменялось. Только lockfile, сгенерированные файлы или переименования — ревью пропускается. Только документация и конфиги — облегчённое ревью. Есть хоть одна строка кода — полное.',
   {on:'PR без кода проверяются дешевле или пропускаются.', off:'Каждый PR, даже правка README, проходит полное ревью всеми моделями.',
    when:'Выключать стоит только на время, если подозреваешь, что важный файл ушёл в «пропустить».'}],
  ['REVIEW_LOCKFILE_REGISTRIES','str','','router','e',[],'Свои реестры пакетов',
   'Движок проверяет, что зависимости в lockfile скачиваются из npm или yarn. Если у проекта свой реестр, впиши его адрес через запятую, иначе такие зависимости будут выглядеть подозрительно.'],
  // ── Что видит модель
  ['REVIEW_CONTEXT_MARGIN','int','40','context','m',['cost','conv'],'Сколько кода показывать вокруг правки',
   'Модель видит не только изменённые строки, но и код рядом с ними. Это число строк сверху и снизу от каждой правки. Больше контекста — модель лучше понимает, что происходит, но каждый запрос дороже.',
   {unit:'lines', min:0, max:400, fp:1, when:'Увеличь, если модели часто пишут «не видно, где объявлено X». Ноль отправляет файлы целиком: на больших файлах это дорого.'}],
  ['REVIEW_SYMBOL_CARDS','flag','1','context','m',['conv'],'Подсказки о вызываемых функциях',
   'Если новый код вызывает функцию из другого файла, модель получает её заголовок: имя, параметры и где она объявлена. Так модель не решит, что функции не существует.',
   {fp:1, on:'Модель видит заголовки вызываемых функций. Работает, только если построен граф кода.', off:'Модель видит лишь дифф и код вокруг него.'}],
  ['GRAPHIFY_BIN','path','.graphify/gf','context','m',[],'Где лежит graphify',
   'Программа, которая строит граф кода: какая функция кого вызывает. На раннере Арча её ставит шаг workflow в .graphify/venv.'],
  ['GRAPH','path','.graphify/graphify-out/graph.json','context','m',[],'Файл графа кода',
   'Готовый граф, который workflow строит перед ревью. По нему движок находит места за пределами PR, которые зависят от изменённого кода.'],
  ['REVIEW_BLAST_REQUIRED','flag','0','context','m',['gate'],'Без графа кода PR не пропускать',
   'Граф показывает, какой код в проекте зависит от правки. Без него ревью не увидит, что изменение сломало вызов в соседнем модуле.',
   {fm:'closed', on:'Граф не построился — PR блокируется, в комментарии объясняется причина. Модели в этом случае не запускаются.',

    const a = oldMap.get(k), b = newMap.get(k), fa = `          ${k}: '${a}'`, fb = `          ${k}: '${b}'`;
    if (a === b) lines.push(['c', fa]);
    else { if (a !== undefined) { lines.push(['d', fa + (b === undefined && BY[k] && a === BY[k].d ? '   # совпадает с умолчанием' : '')]); changes++ } if (b !== undefined) { lines.push(['a', fb]); changes++ } }
  }
  lines.push(['a', '          # <<< ai-reviewer-configurator: env']);
  const sk = S.provider === 'openrouter' ? 'LLM_API_KEY' : 'OLLAMA_API_KEY';
  lines.push(['c', `          ${sk}: \${{ secrets.${sk} }}`]);
  if (W.telegram !== r.wf.telegram) { const t = W.telegram ? 'a' : 'd'; lines.push([t, '          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}'], [t, '          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}']); changes += 2 }
  files.push({path: '.github/workflows/pr-review.yml', note: r.pin ? 'настройки ревью; явные значения по умолчанию убираются' : 'создаётся из шаблона ' + S.targetPin, lines});
  if (W.cache && !r.wf.cache) { files.push({path: '.github/workflows/pr-review.yml', note: 'новый шаг перед «Run AI review»', lines: [['a', '      - uses: actions/cache@v6'], ['a', '        with:'], ['a', '          path: .ai-review/incremental/'], ['a', '          key: ai-review-inc-${{ github.event.pull_request.number }}-${{ github.run_id }}'], ['a', '          restore-keys: ai-review-inc-${{ github.event.pull_request.number }}-']]}); changes += 5 }
  if (r.pin !== S.targetPin) { files.push({path: 'ops/ai-reviewer-ref', note: 'версия движка', lines: [...(r.pin ? [['d', r.pin]] : []), ['a', S.targetPin]]}); changes++ }
  const pj = lineDiff(JSON.stringify(S.baseProfiles[r.id], null, 2).split('\n'), JSON.stringify(S.profiles[r.id], null, 2).split('\n'));
  const pc = pj.filter(l => l[0] !== 'c').length;
  if (pc) { files.push({path: S.env.REVIEW_PROFILE || '.ai-reviewer.json', note: 'профиль', lines: compact(pj)}); changes += pc }
  if (W.metrics !== r.wf.metrics) { files.push({path: '.github/workflows/pr-review-metrics.yml', note: W.metrics ? 'из шаблона ' + S.targetPin : 'удаляется', lines: [[W.metrics ? 'a' : 'd', 'name: PR Review metrics …']]}); changes++ }
  if (W.feedback !== r.wf.feedback) { files.push({path: '.github/workflows/pr-review-feedback.yml', lines: [[W.feedback ? 'a' : 'd', 'name: PR Review feedback …']]}); changes++ }
  return {repo: r.id, slug, files, changes};
}
function lineDiff(a, b) {
  const n = a.length, m = b.length, L = Array.from({length: n + 1}, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { out.push(['c', a[i]]); i++; j++ } else if (L[i + 1][j] >= L[i][j + 1]) out.push(['d', a[i++]]); else out.push(['a', b[j++]]) }
  while (i < n) out.push(['d', a[i++]]); while (j < m) out.push(['a', b[j++]]); return out;
}
function compact(ls) { const keep = ls.map((l, i) => l[0] !== 'c' || ls.slice(Math.max(0, i - 2), i + 3).some(x => x[0] !== 'c')); const out = []; let gap = false;
  ls.forEach((l, i) => { if (keep[i]) { out.push(l); gap = false } else if (!gap) { out.push(['c', '  …']); gap = true } }); return out }

// ── Панель справа ─────────────────────────────────────────────────────────────────
let FIXES = [];
function side() {
  const e = S.env, r = roles(e.MOA_SPECIALIST_MODELS), R = rules();
  const moaDesc = e.REVIEW_MODE === 'consensus' ? `голосование: ${list(e.OLLAMA_MODELS).join(', ') || e.OLLAMA_MODEL}`
    : flag(e.REVIEW_SPECIALISTS) ? `${Object.entries(r).map(([k, v]) => `${(ROLE_L[k] || k).toLowerCase()} — ${v}`).join('; ')}; жюри — ${e.MOA_AGGREGATOR}` : `${e.MOA_REFERENCE_MODELS}; жюри — ${e.MOA_AGGREGATOR}`;
  const P = [
    ['router', 'Отбор PR', flag(e.REVIEW_ROUTER), flag(e.REVIEW_ROUTER) ? 'PR без кода проверяются дешевле' : 'каждый PR проверяется полностью'],
    ['context', 'Что видит модель', true, `±${e.REVIEW_CONTEXT_MARGIN} строк вокруг правки${flag(e.REVIEW_SYMBOL_CARDS) ? ', подсказки о функциях' : ''}, зависимый код на ${e.REVIEW_GRAPHIFY_DEPTH} ${+e.REVIEW_GRAPHIFY_DEPTH === 1 ? 'уровень' : 'уровня'}`, flag(e.REVIEW_BLAST_REQUIRED) ? 'closed' : null],
    ['prescan', 'Линтеры', flag(e.REVIEW_PRESCAN), flag(e.REVIEW_PRESCAN) ? `${flag(e.REVIEW_PRESCAN_ASTGREP) ? 'eslint и ast-grep' : 'eslint'}${flag(e.REVIEW_PRESCAN_BLOCK) ? ', могут блокировать' : ', только замечания'}` : 'выключены'],
    ['moa', 'Модели-ревьюеры', true, moaDesc],
    ['verifier', 'Перепроверка', flag(e.REVIEW_VERIFIER), flag(e.REVIEW_VERIFIER) ? `${e.REVIEW_VERIFIER_MODEL}${e.REVIEW_VERIFIER_FALLBACK_MODEL ? `, запасной ${e.REVIEW_VERIFIER_FALLBACK_MODEL}` : ''}` : 'выключена', flag(e.REVIEW_VERIFIER) && flag(e.REVIEW_VERIFIER_STRICT) ? 'closed' : null],
    ['gate', 'Решение о блокировке', true, `блокирует ${list(e.REVIEW_BLOCK_ON).join(' и ')} с уверенностью от ${e.REVIEW_CONFIDENCE_MIN}${strictOn(e) ? ', только доказанное' : ''}`, flag(e.REVIEW_LLM_REQUIRED) ? 'closed' : 'open'],
    ['delivery', 'Комментарии в PR', true, `в строку кода — ${list(e.REVIEW_INLINE_ON).join(', ')}, остальное в сводку`],
    ['artifacts', 'Отчёты', flag(e.REVIEW_EXPORT) || flag(e.REVIEW_OBSERVABILITY), [flag(e.REVIEW_OBSERVABILITY) && 'журнал', flag(e.REVIEW_EXPORT) && 'отчёт JSON и SARIF', S.wf.metrics && 'сводка'].filter(Boolean).join(', ') || 'ничего не сохраняется'],
  ];
  const FM = {closed: 'сбой → блок', open: 'сбой → пропуск'};
  const c0 = calls(S.base, S.baseWf), c1 = calls(e, S.wf), k = c1 / c0;
  const cls = x => x > 1.02 ? 'up' : x < 0.98 ? 'down' : '';
  const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');
  const order = {error: 0, warn: 1, info: 2}, LV = {error: 'Ошибка', warn: 'Внимание', info: 'К сведению'};
  const sorted = R.sort((a, b) => order[a.level] - order[b.level]);
  FIXES = sorted.map(x => x.fix);
  return `<section><h3>Как пройдёт ревью</h3><p class="lead">Метка «сбой → блок» значит: если этот шаг не сработал, PR не пройдёт.</p><ol class="pipe">${P.map(([st, n, on, d, fm]) => `<li class="${on ? '' : 'off'}" data-go="${st}"><span class="node"></span><div><span class="pn">${n}</span>${fm ? `<span class="fm ${fm}">${FM[fm]}</span>` : ''}<div class="pd">${esc(d)}</div></div></li>`).join('')}</ol></section>
    <section><h3>На что обратить внимание · ${R.length}</h3><div class="rules">${R.length ? sorted.map((x, i) => `<div class="rule ${x.level}"><span class="lv">${LV[x.level]}</span><span>${esc(x.msg)}</span><span class="acts">${x.fix ? `<button class="linkbtn" data-fix="${i}">Исправить: ${esc(x.fix.label.toLowerCase())}</button>` : ''}${x.stage !== S.stage ? `<button class="linkbtn" data-go="${x.stage}">к шагу «${esc(STAGE_T[x.stage])}»</button>` : ''}</span></div>`).join('') : '<p class="note">Всё согласовано, замечаний нет.</p>'}</div></section>
    <section><h3>Стоимость одного прогона</h3><div class="cost"><span class="h"></span><span class="h" style="text-align:right">сейчас</span><span class="h" style="text-align:right">станет</span>
      <span>запросов к моделям</span><span class="v">${fmt(HIST.calls, 0)}</span><span class="v ${cls(k)}">${fmt(HIST.calls * k, 0)}</span>
      <span>токенов, млн</span><span class="v">${fmt(HIST.tokensM, 2)}</span><span class="v ${cls(k)}">${fmt(HIST.tokensM * k, 2)}</span>
      <span>минут</span><span class="v">${fmt(HIST.wallMin)}</span><span class="v ${cls(k)}">${fmt(HIST.wallMin * Math.sqrt(k))}</span></div>
      <p class="note">Посчитано по ${HIST.runs} последним прогонам (здесь — пример) с поправкой на то, сколько запросов сделает новая конфигурация. При смене модели оценка грубая: у другой модели другие цены и скорость.</p></section>`;
}

// ── Каркас ────────────────────────────────────────────────────────────────────────
function stageBadge(st) {
  const R = rules().filter(r => r.stage === st);
  if (R.some(r => r.level === 'error')) return '<span class="b e" title="есть ошибки">!</span>';
  const n = OPTS.filter(o => o.st === st && S.env[o.k] !== S.base[o.k]).length;
  if (n) return `<span class="b" title="изменено настроек: ${n}">${n}</span>`;
  if (R.some(r => r.level === 'warn')) return '<span class="b w" title="есть предупреждения">!</span>';
  return '';
}
function render() {
  let g = '';
  document.getElementById('rail').innerHTML = STAGES.map((s, i) => { const head = s.g !== g ? `<li class="grp">${g = s.g}</li>` : '';
    return head + `<li><button data-go="${s.id}" ${S.stage === s.id ? 'aria-current="step"' : ''}><span class="n">${i + 1}</span><span class="t">${s.t}${s.tech ? `<small>${s.tech}</small>` : ''}</span>${stageBadge(s.id)}</button></li>` }).join('');
  const i = STAGES.findIndex(s => s.id === S.stage), st = STAGES[i];
  document.getElementById('main').innerHTML = `<div class="stage-head"><span class="eyebrow">Шаг ${i + 1} из ${STAGES.length}</span><h2>${st.t}</h2><p class="lead">${st.p}</p>${st.tip ? `<p class="tip">${st.tip}</p>` : ''}</div>`
    + VIEWS[st.id]()
    + `<div class="nav">${i > 0 ? `<button class="btn" data-go="${STAGES[i - 1].id}">← ${STAGES[i - 1].t}</button>` : ''}${i < STAGES.length - 1 ? `<button class="btn primary" data-go="${STAGES[i + 1].id}">${STAGES[i + 1].t} →</button>` : ''}</div>`
    + `<datalist id="models">${(S.provider === 'openrouter' ? MODELS_OLLAMA.map(orName) : MODELS_OLLAMA).map(m => `<option value="${m}">`).join('')}</datalist>`;
  document.getElementById('side').innerHTML = side();
  const sel = selected();
  document.getElementById('hdr-repos').textContent = sel.length === 1 ? sel[0].id : `${sel.length} репозитория`;
  document.getElementById('hdr-pin').textContent = `движок ${S.targetPin}`;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200) }
function setProvider(p) {
  if (p === S.provider) return; S.provider = p;
  const conv = p === 'openrouter' ? orName : olName;
  for (const o of OPTS) if (o.t === 'model' && S.env[o.k]) S.env[o.k] = conv(S.env[o.k]);
  S.env.MOA_SPECIALIST_MODELS = Object.entries(roles(S.env.MOA_SPECIALIST_MODELS)).map(([k, v]) => `${k}:${conv(v)}`).join(',');
  S.env.MOA_REFERENCE_MODELS = list(S.env.MOA_REFERENCE_MODELS).map(conv).join(',');
}
// Набор ложится поверх ручных правок; ключи прошлого набора, которых нет в новом, возвращаются к текущему конфигу.
function applyPreset(k) {
  const prev = S.preset && PRESETS[S.preset], p = PRESETS[k], prov = S.provider;
  setProvider('ollama');
  if (prev) { for (const key of Object.keys(prev.env || {})) S.env[key] = S.base[key]; for (const w of Object.keys(prev.wf || {})) S.wf[w] = S.baseWf[w] }
  if (p.reset) { for (const o of OPTS) if (!PATH_KEYS.includes(o.k)) S.env[o.k] = o.d }
  Object.assign(S.env, p.env || {}); Object.assign(S.wf, p.wf || {});
  S.preset = k; setProvider(prov);
}

// ── События ───────────────────────────────────────────────────────────────────────
document.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-go],li[data-go],[data-set],[data-reset],[data-reset-all],[data-pin],button[data-runner],[data-provider],[data-preset],[data-secret],[data-apply],[data-tab],[data-fix]');
  if (!b) return;
  const d = b.dataset;
  if (d.go) { S.stage = d.go; render(); document.getElementById('main').scrollIntoView({block: 'start'}); return }
  if (d.set) S.env[d.set] = d.v;
  else if (d.reset) S.env[d.reset] = S.base[d.reset];
  else if ('resetAll' in d) { const prov = S.provider; S.env = clone(S.base); S.wf = clone(S.baseWf); S.preset = null; S.provider = 'ollama'; setProvider(prov) }
  else if (d.pin) S.targetPin = d.pin;
  else if (d.provider) setProvider(d.provider);
  else if (d.preset) applyPreset(d.preset);
  else if (d.runner) { S.runner = d.runner; toast(d.runner === '1' ? 'Ревью переключено на домашний сервер (в прототипе не сохраняется)' : 'Ревью переключено на серверы GitHub (в прототипе не сохраняется)') }
  else if (d.secret) { const inp = document.getElementById('sec-' + d.secret); if (!inp.value) { toast('Сначала введи значение ключа'); return }
    for (const r of selected()) S.secrets[r.id][d.secret] = true; inp.value = ''; toast(`${d.secret} записан в ${selected().length === 1 ? 'репозиторий' : selected().length + ' репозитория'} (в прототипе не сохраняется)`) }
  else if ('apply' in d) S.applied = selected().map(r => r.id.split('/')[1]);
  else if (d.tab) S.tab = d.tab;
  else if (d.fix != null) { const f = FIXES[+d.fix]; if (!f) return; f.run(); toast(`Исправлено: ${f.label.toLowerCase()}`) }
  else return;
  render();
});
document.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset;
  if (d.repo) { S.sel[d.repo] = t.checked; if (!selected().length) { S.sel[d.repo] = true; t.checked = true; toast('Нужен хотя бы один репозиторий'); return }
    if (selected().length === 1) loadFrom(primary()) }
  else if (d.k && t.type === 'checkbox') S.env[d.k] = t.checked ? '1' : '0';
  else if (d.k) S.env[d.k] = t.value.trim();
  else if (d.sev) S.env[d.sev] = [...document.querySelectorAll(`[data-sev="${d.sev}"]:checked`)].map(x => x.value).join(',');
  else if (d.role) { const r = roles(S.env.MOA_SPECIALIST_MODELS); r[d.role] = t.value.trim(); S.env.MOA_SPECIALIST_MODELS = Object.entries(r).map(([k, v]) => `${k}:${v}`).join(',') }
  else if (d.wf) S.wf[d.wf] = t.checked;
  else if ('runner' in d) { S.runner = t.checked ? '1' : '0'; toast(t.checked ? 'Ревью переключено на домашний сервер (в прототипе не сохраняется)' : 'Ревью переключено на серверы GitHub (в прототипе не сохраняется)') }
  else if ('nsconfirm' in d) S.nsConfirm = t.checked;
  else if (d.pf) { const p = S.profiles[S.tab]; setPath(p, d.pf, t.type === 'checkbox' ? t.checked : 'list' in d ? t.value.split(',').map(s => s.trim()).filter(Boolean) : t.value) }
  else return;
  S.applied = null; render();
});
render();
