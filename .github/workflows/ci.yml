name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit + eval harness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Rust собирается ПЕРВЫМ (RFC 20): основная реализация — бинари, и юнит-тесты должны
      # идти по ней. Без бинаря обёртки падают на deprecated JS-копии — этот путь покрывает
      # локальный `npm test` на машине без cargo.
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust build
        working-directory: rust
        run: cargo build --locked   # тот же Cargo.lock, по которому собираются бинари релиза

      - name: Unit tests (node:test)
        run: npm test

      - name: Eval harness fixtures (R1)
        run: npm run eval

      - name: Rust tests
        working-directory: rust
        run: cargo test

      # Паритет JS ↔ Rust: обязателен ПОСЛЕ cargo build — скрипты сравнивают собранный
      # бинарь с JS-копией, а без бинаря обе стороны сходятся тривиально и ничего не ловят.
      # До этого шага расхождение сторон не падало ни в одном гейте (docs/backlog.md,
      # «Долг слияния», пункт 2).
      - name: Parity JS ↔ Rust
        run: npm run check:parity
