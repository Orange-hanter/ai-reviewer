[workspace]
members = ["."]
resolver = "2"

[package]
name = "ai-reviewer"
version = "0.1.0"
edition = "2021"
description = "Rust modules for ai-reviewer (JSON через stdin/stdout, вызываются из JS через execFile)"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
indexmap = { version = "2", features = ["serde"] }
