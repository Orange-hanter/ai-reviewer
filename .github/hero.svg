<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="280" rx="16" stroke="#30363d" stroke-width="1.5" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- pipeline -->
    <g font-size="17" fill="#8b949e">
      <rect x="80" y="84" width="120" height="44" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="140" y="112" text-anchor="middle" fill="#c9d1d9">PR diff</text>
      <text x="228" y="112" fill="#484f58">→</text>
      <rect x="252" y="84" width="150" height="44" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="327" y="112" text-anchor="middle" fill="#c9d1d9">prescan</text>
      <text x="430" y="112" fill="#484f58">→</text>
      <rect x="454" y="84" width="170" height="44" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="539" y="112" text-anchor="middle" fill="#c9d1d9">3 specialists</text>
      <text x="652" y="112" fill="#484f58">→</text>
      <rect x="676" y="84" width="110" height="44" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="731" y="112" text-anchor="middle" fill="#c9d1d9">jury</text>
      <text x="814" y="112" fill="#484f58">→</text>
      <rect x="838" y="84" width="140" height="44" rx="8" fill="#21262d" stroke="#30363d"/>
      <text x="908" y="112" text-anchor="middle" fill="#c9d1d9">verifier</text>
      <text x="1006" y="112" fill="#484f58">→</text>
      <rect x="1030" y="84" width="110" height="44" rx="8" fill="#0d2818" stroke="#3fb950"/>
      <text x="1085" y="112" text-anchor="middle" fill="#3fb950">gate</text>
    </g>

    <text x="80" y="196" font-size="52" font-weight="700" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">ai-reviewer</text>
    <text x="80" y="244" font-size="22" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">AI код-ревью для pull request'ов, которому можно дать право</text>
    <text x="80" y="276" font-size="22" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">блокировать merge — только на подтверждённых находках.</text>

    <text x="1008" y="290" font-size="15" fill="url(#accent)">zero deps · node ≥ 22 · SARIF</text>
  </g>
