name: Release binaries

# Готовые Rust-бинари к релизу (RFC 20). Потребитель не ставит cargo: шаблон
# examples/ci/pr-review.yml скачивает архив своей платформы по тому же тегу, по которому
# чекаутит движок, сверяет sha256 и распаковывает в .ai-reviewer-engine/rust/bin.
# Без архива (тег без ассетов, неизвестная платформа) движок работает на deprecated JS-копиях.
#
# Запуск: публикация GitHub-релиза или вручную с именем существующего тега.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег существующего релиза, например v0.6.0'
        required: true

permissions:
  contents: write   # gh release upload

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 — ради glibc 2.35: бинарь со свежего образа не запустится на раннере потребителя
          # со старым glibc, а self-hosted раннеры обновляют редко.
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
          - { target: darwin-arm64, os: macos-14 }
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]] || { echo "invalid tag: $TAG"; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (release, по Cargo.lock)
        working-directory: rust
        run: cargo build --release --locked

      # Дымовой прогон тем, что потребитель реально запустит: npm test с бинарями ТОЛЬКО из
      # target/release (debug-сборки на этом раннере нет — обёртки найдут именно релизные).
      - name: Smoke — npm test на релизных бинарях
        run: npm test

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          NAME="ai-reviewer-bins-${{ matrix.target }}.tar.gz"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          for src in rust/src/bin/*.rs; do
            bin="$(basename "$src" .rs)"
            cp "rust/target/release/$bin" "$STAGE/"
          done
          printf '{"tag":"%s","target":"%s","commit":"%s"}\n' "$TAG" "${{ matrix.target }}" "$(git rev-parse HEAD)" > "$STAGE/manifest.json"
          tar -czf "$RUNNER_TEMP/$NAME" -C "$STAGE" .
          cd "$RUNNER_TEMP"
          if command -v sha256sum >/dev/null; then sha256sum "$NAME" > "$NAME.sha256"; else shasum -a 256 "$NAME" > "$NAME.sha256"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "$RUNNER_TEMP/${{ steps.pack.outputs.name }}" \
            "$RUNNER_TEMP/${{ steps.pack.outputs.name }}.sha256" \
            --clobber -R "$GITHUB_REPOSITORY"
