[workspace]
members = ["."]
resolver = "2"

[package]
name = "ai-reviewer"
version = "0.1.0"
edition = "2021"
description = "Rust modules for ai-reviewer (JSON через stdin/stdout, вызываются из JS через execFile)"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order — порядок ключей как в JS (insertion order Map).
# arbitrary_precision — числа хранятся как в исходном тексте: иначе serde_json
#   падает на переполнении (1e999), а JS даёт Infinity; при повторном JSON.parse
#   на стороне JS round-trip значение совпадает с прямым JSON.parse.
# unbounded_depth — лимит вложенности 128 у serde_json, у V8 его нет; в json_repair
#   поверх стоит собственный итеративный depth-guard (см. MAX_NESTING_DEPTH).
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "unbounded_depth"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
indexmap = { version = "2", features = ["serde"] }
# sha256 для findingFingerprint (12-hex-символьный отпечаток кода в локации находки)
# и stableId из lib/util.mjs (sha256 parts.join('\0'), 24 hex).
sha2 = "0.10"
# base64: бинарный SCIP-индекс приходит в JSON-контракт как {dataBase64}.
base64 = "0.22"
