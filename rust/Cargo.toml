[workspace]
members = ["."]
resolver = "2"

[package]
name = "ai-reviewer"
version = "0.5.0"
edition = "2021"
description = "AI-ревью для PR: бинарь pr-review с подкомандами (RFC 20) плюс временный мост из JSON-stdin бинарей, которые зовёт JS через execFile"
license = "UNLICENSED"
publish = false
# Явная секция [[bin]] ниже не отключает автообнаружение целей в edition 2021
# (autobins выключался только в edition 2015), поэтому 25 JSON-stdin бинарей-мостов
# из src/bin/ продолжают собираться до cutover. Пишем флаг явно, чтобы будущая
# смена edition не выключила их молча.
autobins = true

# Единый бинарь потребителя (RFC 20, решение 1): pr-review <подкоманда>.
# src/main.rs — только диспетчер clap, вся логика в ai_reviewer::cli::*.
[[bin]]
name = "pr-review"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order — порядок ключей как в JS (insertion order Map).
# arbitrary_precision — числа хранятся как в исходном тексте: иначе serde_json
#   падает на переполнении (1e999), а JS даёт Infinity; при повторном JSON.parse
#   на стороне JS round-trip значение совпадает с прямым JSON.parse.
# unbounded_depth — лимит вложенности 128 у serde_json, у V8 его нет; в json_repair
#   поверх стоит собственный итеративный depth-guard (см. MAX_NESTING_DEPTH).
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "unbounded_depth"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
indexmap = { version = "2", features = ["serde"] }
# sha256 для findingFingerprint (12-hex-символьный отпечаток кода в локации находки)
# и stableId из lib/util.mjs (sha256 parts.join('\0'), 24 hex).
sha2 = "0.10"
# base64: бинарный SCIP-индекс приходит в JSON-контракт как {dataBase64}.
base64 = "0.22"
# fancy-regex: backtracking-движок с lookaround и backreferences — только для
# regex, которые пишет потребитель и диалект которых мы не контролируем
# (fp-patterns regex/requiresPath, поля профиля lintable/e2eSpec/logic/sensitive,
# astgrep.scopes). Код движка остаётся на crate regex ради линейного времени.
fancy-regex = "0.14"
# include_dir: ruleset ast-grep (sgconfig.yml + правила) вшивается в бинарь —
# рядом с одиночным исполняемым файлом дерева пакета нет (RFC 20, решение 5).
include_dir = "0.7"
# tempfile: вшитый ruleset распаковывается во временный каталог, потому что
# читает его внешний процесс ast-grep, а не мы.
tempfile = "3"
# libc: geteuid — проверка, что каталог распакованного ruleset в общем temp наш
# (уже есть в дереве транзитивно через tempfile/reqwest).
libc = "0.2"
# rustls вместо native-tls (в reqwest 0.13 фича называется именно так, не
# "rustls-tls"): кросс-сборка релизной матрицы с OpenSSL не воспроизводима
# (RFC 20, решение 9). default-features = false отключает только неявный подбор;
# charset/http2/system-proxy перечислены явно, чтобы поведение HTTP-клиента
# осталось тем же, что было на дефолтах.
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "rustls",
    "charset",
    "http2",
    "system-proxy",
] }

[dev-dependencies]
# assert_cmd + predicates: чёрноящичные тесты бинаря pr-review в rust/tests/
# (проверяют коды возврата и вывод так же, как их увидит CI потребителя).
assert_cmd = "2"
predicates = "3"
