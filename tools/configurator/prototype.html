<meta charset="utf-8">
<title>Конфигуратор ai-reviewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Раскладка: рельс стадий слева, форма стадии в центре, панель последствий справа (схема, правила, цена). */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #f6f8fa; --ink: #17202b; --muted: #5a6575; --line: #d6dce4;
  --accent: #1d6a73; --accent-ink: #ffffff; --accent-soft: #d9eced;
  --ok: #1d7a45; --ok-soft: #dcf0e3; --warn: #9a5800; --warn-soft: #fbeed8; --err: #b0261d; --err-soft: #f9dfdc;
  --add: #e3f3e8; --del: #fbe4e1;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #151c25; --sunk: #111820; --ink: #e2e8ef; --muted: #93a0b0; --line: #283241;
  --accent: #56b4bd; --accent-ink: #08191b; --accent-soft: #163a3e;
  --ok: #57c486; --ok-soft: #12301f; --warn: #e5a443; --warn-soft: #36270f; --err: #f2766c; --err-soft: #3a1714;
  --add: #12301f; --del: #3a1714; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c25; --sunk: #111820; --ink: #e2e8ef; --muted: #93a0b0; --line: #283241;
  --accent: #56b4bd; --accent-ink: #08191b; --accent-soft: #163a3e;
  --ok: #57c486; --ok-soft: #12301f; --warn: #e5a443; --warn-soft: #36270f; --err: #f2766c; --err-soft: #3a1714;
  --add: #12301f; --del: #3a1714; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
code, .mono { font-family: var(--f-mono); font-size: 12.5px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface) }
.top h1 { font-size: 19px; letter-spacing: .01em }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
  font-size: 12px; color: var(--muted); background: var(--sunk); white-space: nowrap }
.chip.proto { border-color: var(--warn); color: var(--warn); background: var(--warn-soft) }
.top .spacer { flex: 1 }

.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr) 330px; gap: 0; align-items: start; min-height: calc(100vh - 60px) }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); padding: 14px 10px 24px max(10px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--line); max-height: 100vh; overflow-y: auto }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.rail button { width: 100%; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px; text-align: left;
  padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; color: var(--ink) }
.rail button:hover { background: var(--sunk) }
.rail button[aria-current="step"] { background: var(--accent-soft); }
.rail .n { font: 500 11px var(--f-mono); color: var(--muted); text-align: right }
.rail .t { font-size: 13.5px }
.rail .b { font: 500 11px var(--f-mono); padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink) }
.rail .b.w { background: var(--warn); color: var(--surface) }
.rail .b.e { background: var(--err); color: var(--surface) }
.rail .grp { font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 8px 4px }

main { min-width: 0; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.stage-head { display: grid; gap: 4px; margin-bottom: 16px; max-width: 760px }
.stage-head .eyebrow { font: 500 12px var(--f-mono); color: var(--accent) }
.stage-head h2 { font-size: 26px }
.stage-head p { margin: 0; color: var(--muted); max-width: 68ch }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; max-width: 760px }
.card + .card, .card + details, details + .card { margin-top: 14px }
.card > h3 { font-size: 15px; padding: 12px 16px 0 }
.card > .sub { margin: 2px 16px 0; color: var(--muted); font-size: 13px }

.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px 16px; border-top: 1px solid var(--line) }
.card > h3 + .field, .card > .sub + .field { margin-top: 10px }
.field:first-child { border-top: 0 }
.field .k { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0 }
.field .k code { font-weight: 500; overflow-wrap: anywhere }
.field .help { grid-column: 1 / -1; color: var(--muted); font-size: 13px; max-width: 70ch; margin: 0 }
.field .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted) }
.field .ctl { display: flex; align-items: center; gap: 8px; justify-content: flex-end; min-width: 0 }
.field.changed { background: linear-gradient(90deg, var(--accent-soft), transparent 55%) }
.field.wide .ctl { grid-column: 1 / -1; justify-content: stretch }
.field.wide .ctl > * { flex: 1 }
.tag { font: 500 10.5px var(--f-body); letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted) }
.tag.t-gate { border-color: var(--err); color: var(--err) }
.tag.t-cost { border-color: var(--warn); color: var(--warn) }
.tag.t-conv { border-color: var(--accent); color: var(--accent) }
.tag.closed { background: var(--err-soft); border-color: transparent; color: var(--err) }
.chg { font: 500 11px var(--f-mono); color: var(--accent) }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; text-decoration: underline; text-underline-offset: 2px }

input[type=text], input[type=number], input[type=password], select, textarea {
  background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0 }
input[type=number] { width: 120px; font-family: var(--f-mono); font-size: 13px }
input[type=text].mono, textarea.mono { font-family: var(--f-mono); font-size: 12.5px }
textarea { width: 100%; min-height: 84px; resize: vertical }
input.bad, textarea.bad { border-color: var(--err); background: var(--err-soft) }

.sw { position: relative; width: 40px; height: 22px; flex: none }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer }
.sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s }
.sw input:checked + span { background: var(--accent) }
.sw input:checked + span::after { transform: translateX(18px) }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.seg button { border: 0; border-left: 1px solid var(--line); background: var(--sunk); padding: 5px 10px; cursor: pointer; font-size: 13px }
.seg button:first-child { border-left: 0 }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.checks { display: flex; flex-wrap: wrap; gap: 6px }
.checks label { display: inline-flex; gap: 5px; align-items: center; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); font-size: 13px; cursor: pointer }

details.expert { max-width: 760px; margin-top: 14px; border: 1px dashed var(--line); border-radius: 8px; background: var(--surface) }
details.expert > summary { cursor: pointer; padding: 10px 16px; font-weight: 500; color: var(--muted) }
details.expert[open] > summary { border-bottom: 1px solid var(--line) }

.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; padding: 12px 16px 16px }
.choice { display: grid; gap: 4px; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); cursor: pointer }
.choice b { font-family: var(--f-display); font-size: 15px; font-weight: 600 }
.choice span { font-size: 12.5px; color: var(--muted) }
.choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft) }

table.t { width: 100%; border-collapse: collapse; font-size: 13px }
table.t th, table.t td { text-align: left; padding: 8px 16px; border-top: 1px solid var(--line); vertical-align: middle }
table.t th { font-weight: 500; color: var(--muted); font-size: 12px }
.tw { overflow-x: auto }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted) }
.dot.ok { background: var(--ok) } .dot.warn { background: var(--warn) } .dot.err { background: var(--err) }

.nav { display: flex; gap: 10px; margin-top: 18px; max-width: 760px; flex-wrap: wrap }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 500 }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn:disabled { opacity: .45; cursor: not-allowed }

aside { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; border-left: 1px solid var(--line);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 30px 16px; display: grid; gap: 18px; min-width: 0 }
aside h3 { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin-bottom: 8px }
.pipe { list-style: none; margin: 0; padding: 0; display: grid }
.pipe li { position: relative; display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding-bottom: 10px; cursor: pointer }
.pipe li::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px; background: var(--line) }
.pipe li:last-child::before { display: none }
.pipe .node { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); margin-top: 3px; z-index: 1 }
.pipe li.off .node { border-color: var(--line); background: var(--sunk) }
.pipe li.off .pn { color: var(--muted); text-decoration: line-through }
.pipe .pn { font-weight: 600; font-size: 13.5px }
.pipe .pd { font-size: 12px; color: var(--muted); overflow-wrap: anywhere }
.pipe .fm { font: 500 10px var(--f-body); letter-spacing: .05em; text-transform: uppercase; margin-left: 6px; padding: 0 5px; border-radius: 3px }
.pipe .fm.closed { background: var(--err-soft); color: var(--err) }
.pipe .fm.open { background: var(--ok-soft); color: var(--ok) }
.rules { display: grid; gap: 6px }
.rule { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; border: 0; text-align: left; cursor: pointer; background: var(--sunk); color: var(--ink) }
.rule.warn { background: var(--warn-soft) } .rule.error { background: var(--err-soft) }
.rule .lv { font: 600 10px var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding-top: 2px }
.rule.warn .lv { color: var(--warn) } .rule.error .lv { color: var(--err) } .rule.info .lv { color: var(--accent) }
.cost { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: 13px; font-variant-numeric: tabular-nums }
.cost .h { color: var(--muted); font-size: 11.5px }
.cost .v { text-align: right; font-family: var(--f-mono); font-size: 12.5px }
.cost .up { color: var(--warn) } .cost .down { color: var(--ok) }
.note { font-size: 12px; color: var(--muted); margin: 6px 0 0 }

.diff { font: 12.5px/1.55 var(--f-mono); margin: 0; padding: 10px 0; overflow-x: auto; background: var(--sunk); border-top: 1px solid var(--line) }
.diff div { padding: 0 16px; white-space: pre }
.diff .a { background: var(--add) } .diff .d { background: var(--del) } .diff .c { color: var(--muted) }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0 }
.tabs button { border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; padding: 5px 10px; background: var(--sunk); cursor: pointer; font-size: 13px }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--accent); font-weight: 600 }
.match { font-size: 12px; color: var(--muted); grid-column: 1 / -1 }
.match code { font-size: 11.5px }
.banner { max-width: 760px; padding: 12px 16px; border-radius: 8px; margin-bottom: 14px; font-size: 13.5px }
.banner.ok { background: var(--ok-soft); color: var(--ok) }
.banner.err { background: var(--err-soft); color: var(--err) }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 14px; border-radius: 6px; font-size: 13px; max-width: min(420px, calc(100vw - 32px)) }

@media (max-width: 1180px) {
  .shell { grid-template-columns: 220px minmax(0, 1fr) }
  aside { grid-column: 1 / -1; position: static; max-height: none; border-left: 0; border-top: 1px solid var(--line);
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); padding-left: max(16px, env(safe-area-inset-left, 0px)) }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr) }
  .rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto }
  .rail ol { grid-auto-flow: column; grid-auto-columns: max-content }
  .rail .grp { display: none }
  .field { grid-template-columns: minmax(0, 1fr) }
  .field .ctl { justify-content: flex-start }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<header class="top">
  <h1>Конфигуратор ai-reviewer</h1>
  <span class="chip" id="hdr-repos"></span>
  <span class="chip" id="hdr-pin"></span>
  <span class="spacer"></span>
  <span class="chip proto">прототип · данные — пример, ничего не записывается</span>
</header>
<div class="shell">
  <nav class="rail" aria-label="Стадии"><ol id="rail"></ol></nav>
  <main id="main"></main>
  <aside id="side"></aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
// ── Схема опций (подмножество будущего schemas/config-options.v1.json) ───────────────
// [ключ, тип, дефолт, стадия, слой (m|e), эффекты, пояснение, доп.]
const SEV = ['critical', 'major', 'minor', 'nit'];
const RAW = [
  // router
  ['REVIEW_ROUTER','flag','1','router','m',['cost'],'skip для lockfile/сгенерированного/rename, light для docs и конфигов, full при любом коде. Выкл. — всегда полный прогон.'],
  ['REVIEW_LOCKFILE_REGISTRIES','str','','router','e',[],'Хосты через запятую сверх registry.npmjs.org и registry.yarnpkg.com для проверки источников в lockfile.'],
  // context
  ['REVIEW_CONTEXT_MARGIN','int','40','context','m',['cost','conv'],'±строк вокруг изменённых строк в контексте advisors и жюри (RFC 07). 0 — файлы целиком.',{min:0,max:400,fp:1}],
  ['REVIEW_SYMBOL_CARDS','flag','1','context','m',['conv'],'Строка объявления символа, который вызывает добавленный код (RFC 14). Без graph.json молча выключено.',{fp:1}],
  ['GRAPHIFY_BIN','path','.graphify/gf','context','m',[],'Бинарь graphify для blast-radius.'],
  ['GRAPH','path','.graphify/graphify-out/graph.json','context','m',[],'Граф кода. Нет файла — blast-radius пустой (или блок при BLAST_REQUIRED).'],
  ['REVIEW_BLAST_REQUIRED','flag','0','context','m',['gate'],'Blast-radius не посчитан → exit 1 до LLM, sticky с причиной (RFC 16).',{fm:'closed'}],
  ['REVIEW_GRAPHIFY_DEPTH','int','2','context','m',[],'--depth для graphify affected.',{min:1,max:5}],
  ['GRAPHIFY_REPORT','path','.graphify/graphify-out/GRAPH_REPORT.md','context','e',[],'Отчёт графа (свежесть).'],
  ['REVIEW_GRAPHIFY_DROP_AMBIGUOUS','flag','1','context','e',[],'Отбрасывать AMBIGUOUS-рёбра в blast.'],
  ['REVIEW_SKIP_ADDED_FILE_CONTEXT','flag','1','context','e',['cost'],'Не прикладывать текст добавленных файлов: их дифф и есть содержимое.'],
  ['REVIEW_CONTEXT_WINDOW_MIN_CHARS','int','8000','context','e',['cost'],'Файл короче — целиком, без окон.'],
  ['REVIEW_MAX_FILE_LINES','int','1500','context','e',['cost'],'Полный текст файла в контекст до N строк.'],
  ['REVIEW_MAX_CONTEXT_BYTES','int','180000','context','e',['cost'],'Потолок контекста.'],
  ['REVIEW_SYMBOL_CARDS_MAX','int','20','context','e',[],'Карточек на чанк.'],
  ['REVIEW_SYMBOL_CARDS_MAX_CHARS','int','3000','context','e',[],'Символов карточек на чанк.'],
  ['REVIEW_SYMBOL_CARDS_BODY_MAX_LINES','int','0','context','e',[],'Тело не длиннее N строк едет целиком; 0 — только объявление.'],
  ['REVIEW_MAX_SYMBOLS','int','25','context','e',[],'Символов в blast-radius.'],
  ['REVIEW_MAX_DEPS_PER_SYMBOL','int','20','context','e',[],'Зависимостей на символ.'],
  ['REVIEW_GOD_NODE_THRESHOLD','int','20','context','e',[],'Порог «god node» в графе.'],
  // prescan
  ['REVIEW_PRESCAN','flag','1','prescan','m',[],'eslint + ast-grep по изменённым файлам до LLM. Нет бинаря/конфига — молча пропускается.',{fm:'open'}],
  ['REVIEW_PRESCAN_BLOCK','flag','1','prescan','m',['gate'],'Правила из block-списка блокируют merge без LLM.'],
  ['REVIEW_PRESCAN_BLOCK_RULES','str','no-restricted-imports,no-restricted-globals','prescan','m',['gate'],'eslint-правила уровня блока.'],
  ['REVIEW_PRESCAN_ASTGREP','flag','1','prescan','m',[],'ast-grep анти-паттерны.'],
  ['REVIEW_PRESCAN_ASTGREP_BLOCK_RULES','str','raw-x-forwarded-for','prescan','m',['gate'],'ast-grep правила уровня блока.'],
  ['REVIEW_APP_DIR','path','','prescan','m',[],'Каталог с node_modules для линтеров; пусто — layout.appDir профиля.'],
  ['REVIEW_PRESCAN_MAX_FILES','int','30','prescan','e',[],'Потолок файлов на прогон.'],
  ['REVIEW_ESLINT_BIN','str','npx','prescan','e',[],'Если нет локального node_modules/.bin/eslint.'],
  ['REVIEW_ASTGREP_CONFIG','path','','prescan','e',[],'sgconfig.yml; пусто — paths.astgrepConfig профиля → ruleset пакета.'],
  ['REVIEW_ASTGREP_BIN','str','ast-grep','prescan','e',[],'Путь к бинарю.'],
  // moa
  ['REVIEW_MODE','enum','moa','moa','m',['cost','conv'],'moa — роли + жюри-агрегатор; consensus — N моделей и голосование.',{en:['moa','consensus'],fp:1}],
  ['REVIEW_SPECIALISTS','flag','1','moa','m',['cost','conv'],'Роли security / correctness / architecture вместо анонимных advisors.',{fp:1}],
  ['MOA_SPECIALIST_MODELS','roles','security:glm-5.3-flash,correctness:kimi-k2.7-code,architecture:glm-5.3','moa','m',['cost','conv'],'Роль → модель.',{fp:1}],
  ['REVIEW_SPECIALISTS_MERGE','enum','auto','moa','m',['cost'],'auto — один вызов на роли с одной моделью; always — сливать всегда; never — по отдельности.',{en:['auto','always','never'],fp:1}],
  ['MOA_AGGREGATOR','model','minimax-m3','moa','m',['cost','conv'],'Жюри-агрегатор (JSON), вне пула advisors.',{fp:1}],
  ['OLLAMA_MODELS_FALLBACK','model','deepseek-v4.1-flash','moa','m',[],'Аварийная замена упавшей модели.'],
  ['MOA_REFERENCE_MODELS','str','kimi-k2.7-code,glm-5.3,glm-5.3-flash','moa','e',['cost'],'Advisors без ролей (REVIEW_SPECIALISTS=0).',{fp:1}],

function fullEnv(partial) { const e = {}; for (const o of OPTS) e[o.k] = o.k in partial ? partial[o.k] : o.d; return e }
function loadFrom(repo) {
  S.env = fullEnv(repo.env); S.base = clone(S.env); S.wf = clone(repo.wf); S.baseWf = clone(repo.wf);

}
for (const r of REPOS) { S.profiles[r.id] = clone(r.profile); S.baseProfiles[r.id] = clone(r.profile); S.secrets[r.id] = clone(r.secrets) }
loadFrom(REPOS[0]);

const flag = v => v === '1';
const strictOn = e => flag(e.REVIEW_STRICT) || S.profiles[primary().id]?.strict === true;
const eff = (e, k) => k === 'REVIEW_REQUIRE_QUOTE' && e[k] === '=strict' ? (strictOn(e) ? '1' : '0') : e[k];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roles = v => Object.fromEntries((v || '').split(',').filter(Boolean).map(p => p.split(':')));
const list = v => (v || '').split(',').map(s => s.trim()).filter(Boolean);

// ── Правила ─────────────────────────────────────────────────────────────────────────
function rules() {
  const e = S.env, out = [], add = (level, stage, msg) => out.push({level, stage, msg});
  const pool = new Set(Object.values(roles(e.MOA_SPECIALIST_MODELS)).map(olName));
  if (!flag(e.REVIEW_SPECIALISTS)) list(e.MOA_REFERENCE_MODELS).forEach(m => pool.add(olName(m)));
  if (e.REVIEW_MODE === 'moa' && +e.REVIEW_CONSENSUS > 1) add('warn','gate',`В moa REVIEW_CONSENSUS зажимается до 1 — значение ${e.REVIEW_CONSENSUS} не действует.`);
  if (+e.REVIEW_LLM_TIMEOUT_MS < 300000) add('warn','economy',`REVIEW_LLM_TIMEOUT_MS = ${e.REVIEW_LLM_TIMEOUT_MS}: при 240000 обрывалась половина prose-вызовов (медиана kimi — 331 с). Дефолт — 420000.`);
  if (!flag(e.REVIEW_VERIFIER) && flag(e.REVIEW_VERIFIER_STRICT)) add('warn','verifier','Verifier выключен при VERIFIER_STRICT=1: все LLM-блокеры станут minor, блокировать будет только prescan.');
  if (strictOn(e) && !flag(e.REVIEW_VERIFIER)) add('error','gate','Strict-гейт без verifier: ни одна LLM-находка не может стать блокером. Включи verifier или выключи strict.');
  if (pool.has(olName(e.REVIEW_VERIFIER_MODEL))) add('warn','verifier',`Verifier ${e.REVIEW_VERIFIER_MODEL} в пуле advisors — второй судья перестаёт быть независимым.`);
  if (pool.has(olName(e.MOA_AGGREGATOR))) add('warn','moa',`Агрегатор ${e.MOA_AGGREGATOR} в пуле advisors — жюри оценивает само себя.`);
  if (e.REVIEW_PROMPT_LAYOUT === 'shared-prefix' && S.provider === 'ollama') add('info','moa','shared-prefix на Ollama Cloud: замер pr-review-probe-cache скидки за общий префикс не нашёл.');
  if (flag(e.REVIEW_INCREMENTAL) && !S.wf.cache) add('warn','economy','Incremental без actions/cache: состояние не переживёт прогон, каждый прогон будет полным.');
  if (flag(e.REVIEW_INCREMENTAL) && S.wf.cache && !S.baseWf.cache) add('info','economy','В workflow добавится шаг actions/cache на каталог состояния.');
  if (flag(e.REVIEW_BLAST_REQUIRED) && !e.GRAPH) add('error','context','BLAST_REQUIRED=1 без пути к graph.json — каждый PR с кодом заблокируется до LLM.');
  if (!flag(e.REVIEW_LLM_REQUIRED)) add('info','gate','LLM_REQUIRED=0: аутедж моделей пропускает merge (fail-open).');
  const bo = list(e.REVIEW_BLOCK_ON), bs = list(e.REVIEW_BLOCK_SINGLE);
  if (bs.some(s => !bo.includes(s))) add('warn','gate','BLOCK_SINGLE содержит severity вне BLOCK_ON — она не блокирует вообще.');
  if (+e.REVIEW_TIME_BUDGET_MIN >= 25) add('warn','economy','Тайм-бюджет LLM ≥ timeout-minutes job (25): раннер убьёт job раньше частичного отчёта.');
  if (S.provider === 'openrouter') {
    for (const r of selected()) if (!S.secrets[r.id].LLM_API_KEY) add('error','access',`${r.id}: OpenRouter выбран, секрета LLM_API_KEY нет.`);
  } else for (const r of selected()) if (!S.secrets[r.id].OLLAMA_API_KEY) add('error','access',`${r.id}: нет OLLAMA_API_KEY — ревью не запустится (soft-fail).`);
  for (const r of selected()) if (wfFor(r).telegram && !S.secrets[r.id].TELEGRAM_BOT_TOKEN) add('warn','access',`${r.id}: Telegram включён, TELEGRAM_BOT_TOKEN нет.`);
  if (!e.REVIEW_PRICE_JSON) add('info','artifacts','Без REVIEW_PRICE_JSON цена в долларах не считается — оценка только в вызовах и токенах.');
  if (e.LLM_MODEL_SETTINGS) { try { JSON.parse(e.LLM_MODEL_SETTINGS) } catch { add('error','moa','LLM_MODEL_SETTINGS — невалидный JSON.') } }
  if (e.REVIEW_PRICE_JSON) { try { JSON.parse(e.REVIEW_PRICE_JSON) } catch { add('error','artifacts','REVIEW_PRICE_JSON — невалидный JSON (движок сочтёт «не задано»).') } }
  for (const r of selected()) {
    const p = S.profiles[r.id], bp = S.baseProfiles[r.id];
    if (r.pin && p.markerNamespace !== bp.markerNamespace && !S.nsConfirm) add('error','profile',`${r.id}: смена markerNamespace рвёт carry-over находок, Δ-блок и auto-triage прошлых PR. Подтверди на шаге «Профиль».`);
    if (p.layout?.reviewSkip && !(flag(e.REVIEW_PROFILE_TRUSTED))) add('warn','profile',`${r.id}: layout.reviewSkip без REVIEW_PROFILE_TRUSTED=1 игнорируется целиком.`);
    for (const [f, v] of regexFields(p)) { const bad = reErr(v); if (bad) add('error','profile',`${r.id}: ${f} — невалидный регэксп.`) }
    if (!r.pin && S.targetPin) add('info','repos',`${r.id}: bootstrap — PR добавит ops/ai-reviewer-ref, workflow целиком и профиль.`);
  }
  const fpChanged = OPTS.some(o => o.fp && S.env[o.k] !== S.base[o.k]);
  if (fpChanged && flag(e.REVIEW_INCREMENTAL)) add('info','economy','Изменены опции из отпечатка конфигурации: первый прогон после merge будет полным.');
  if (S.env.REVIEW_BLAST_VERIFY !== '1' && verIdx(S.targetPin) >= 1) add('info','verifier',`REVIEW_BLAST_VERIFY=${S.env.REVIEW_BLAST_VERIFY}: откат RFC 21.`);
  for (const r of selected()) if (verIdx(r.pin) < verIdx(S.targetPin) && r.pin) add('info','repos',`${r.id}: bump ${r.pin} → ${S.targetPin} войдёт в тот же PR.`);
  return out;
}
const verIdx = v => VERSIONS.findIndex(x => x.v === v);
// Workflow-переключатели в пакетном режиме — тоже дельтой: меняется только то, что тронули.
const wfFor = r => Object.fromEntries(Object.keys(S.wf).map(k => [k, S.wf[k] !== S.baseWf[k] ? S.wf[k] : r.wf[k]]));
function regexFields(p) { const l = p.layout || {}, out = []; for (const f of ['lintable','e2eSpec','sensitive','reviewSkip']) if (l[f]) out.push([`layout.${f}`, l[f]]);
  for (const [k, v] of Object.entries(p.astgrep?.scopes || {})) if (v) out.push([`astgrep.scopes.${k}`, v]); return out }
function reErr(v) { try { new RegExp(v); return null } catch (e) { return e.message } }

// ── Оценка цены ─────────────────────────────────────────────────────────────────────
function calls(e, wf) {
  const chunks = Math.min(+e.REVIEW_MAX_CHUNKS || 40, HIST.chunks * 56000 / Math.max(8000, +e.REVIEW_CHUNK_BYTES || 56000));
  let per;
  if (e.REVIEW_MODE === 'consensus') per = Math.max(1, list(e.OLLAMA_MODELS).length || 1);
  else if (flag(e.REVIEW_SPECIALISTS)) {
    const ms = Object.values(roles(e.MOA_SPECIALIST_MODELS));
    per = (e.REVIEW_SPECIALISTS_MERGE === 'always' ? 1 : e.REVIEW_SPECIALISTS_MERGE === 'never' ? ms.length : new Set(ms).size) + 1;
  } else per = list(e.MOA_REFERENCE_MODELS).length + 1;
  let total = chunks * per;
  if (flag(e.REVIEW_CHUNK_ROUTING)) total *= 0.9;
  if (flag(e.REVIEW_INCREMENTAL) && wf.cache) { const n = Math.max(1, +e.REVIEW_INCREMENTAL_FULL_EVERY || 10); total *= 1 / n + (n - 1) / n * (1 - HIST.reuse) }
  if (flag(e.REVIEW_VERIFIER)) total += Math.min(+e.REVIEW_VERIFIER_BATCHES || 3, 1.3);
  return total;
}

  }
}

document.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset;
  if (d.repo) { S.sel[d.repo] = t.checked; if (!selected().length) { S.sel[d.repo] = true; t.checked = true; toast('Нужен хотя бы один репозиторий'); return }
    const p = primary(); if (selected().length === 1) loadFrom(p) }
  else if (d.k && t.type === 'checkbox') S.env[d.k] = t.checked ? '1' : '0';
  else if (d.k) S.env[d.k] = t.value.trim();
  else if (d.sev) S.env[d.sev] = [...document.querySelectorAll(`[data-sev="${d.sev}"]:checked`)].map(x => x.value).join(',');
  else if (d.role) { const r = roles(S.env.MOA_SPECIALIST_MODELS); r[d.role] = t.value.trim(); S.env.MOA_SPECIALIST_MODELS = Object.entries(r).map(([k, v]) => `${k}:${v}`).join(',') }
  else if (d.wf) S.wf[d.wf] = t.checked;
  else if ('runner' in d) { S.runner = t.checked ? '1' : '0'; toast(`vars.SELF_HOSTED_CI = ${S.runner} (прототип: не записано)`) }
  else if ('nsconfirm' in d) S.nsConfirm = t.checked;
  else if (d.pf) { const p = S.profiles[S.tab]; setPath(p, d.pf, t.type === 'checkbox' ? t.checked : 'list' in d ? t.value.split(',').map(s => s.trim()).filter(Boolean) : t.value) }
  else return;
  S.applied = null; render();
});
render();
</script>
