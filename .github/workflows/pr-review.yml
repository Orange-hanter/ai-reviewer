name: PR Review (AI, self)

# Ревью PR самого движка его же гейтом (dogfood). Отличие от шаблона потребителя
# examples/ci/pr-review.yml — откуда берётся движок:
#
#   - у потребителя движок чекаутится из ОТДЕЛЬНОГО репозитория по пину из base-ветки;
#   - здесь движок и код PR — один репозиторий, поэтому движок чекаутится по base.sha PR
#     в engine/ и собирается cargo из ЕГО Cargo.lock. Код PR (в т.ч. правки bin/, lib/,
#     rust/, .ai-reviewer.json) с ключом LLM в env не исполняется никогда: PR, меняющий
#     движок, ревьюится движком base-ветки, новое поведение включится после мержа.
#
# Код PR лежит в pr/, рядом с engine/, а не в корне workspace: ни один исполняемый путь
# (движок, бинари cargo, venv graphify) не находится внутри чекаута PR. Иначе PR, закоммитивший
# через `git add -f` файл по такому пути (например .graphify/venv/bin/graphify), исполнил бы
# его с секретами прогона. venv graphify — в $RUNNER_TEMP по той же причине.
#
# Профиль .ai-reviewer.json и его вход движок читает из base.sha (REVIEW_PROFILE_TRUSTED +
# REVIEW_BASE_REF): PR не может ослабить правила собственного ревью.
# Провайдер — OpenRouter, секрет OPENROUTER_API_KEY; ростер моделей — как у orakul.
# prescan выключен: у пакета нет node_modules/eslint-конфига, а поставляемый ast-grep ruleset
# написан под TypeScript и на .mjs не срабатывает (docs/model-tuning.md, «Локальный прогон»).
# Сигнал blastCaller даёт code graph (graphify), собранный по коду PR — парсинг, не исполнение.
#
# Ревью постится как event=COMMENT и выходит 1 на подтверждённых блокерах (red check).
# Обязательным для merge его делает только required-check в branch protection.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Номер PR для ручного ревью'
        required: true

concurrency:
  group: pr-review-self-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI code review (self)
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 25 у шаблона + сборка движка cargo на холодном кэше
    # Черновики, PR от ботов и PR из форков пропускаем: у форка нет секретов, а токен read-only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.user.type != 'Bot' &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Resolve PR and engine ref
        id: pr
        env:
          EVENT: ${{ github.event_name }}
          PR_EVENT: ${{ github.event.pull_request.number }}
          PR_INPUT: ${{ inputs.pr_number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != true ]; then
            echo "::warning::секрет OPENROUTER_API_KEY не задан — ревью пропущено (gh secret set OPENROUTER_API_KEY)"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            PR="$PR_INPUT"
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "invalid pr_number: $PR"; exit 1; }
            # Ручной запуск идёт мимо job-фильтра: PR из форка с секретами не ревьюим.
            HEAD_REPO="$(gh api "repos/$REPO/pulls/$PR" -q .head.repo.full_name)"
            [ "$HEAD_REPO" = "$REPO" ] || { echo "PR #$PR из форка ($HEAD_REPO) — ревью с секретами запрещено"; exit 1; }
            BASE_SHA="$(gh api "repos/$REPO/pulls/$PR" -q .base.sha)"
            CHECKOUT="refs/pull/$PR/head"
          else
            PR="$PR_EVENT"
            CHECKOUT=""   # merge-коммит PR — дефолт actions/checkout для pull_request
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid base sha: $BASE_SHA"; exit 1; }
          echo "→ PR #$PR, движок ai-reviewer@$BASE_SHA (base)"
          {
            echo "run=true"
            echo "pr=$PR"
            echo "base=$BASE_SHA"
            echo "checkout=$CHECKOUT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.checkout }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout engine at base
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.base }}
          path: engine
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.pr.outputs.run == 'true'
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        if: steps.pr.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Cache graphify venv
        if: steps.pr.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/graphify-venv
          key: gf-venv-${{ runner.os }}-py311-graphifyy-0.9.87-v1

      # Упавший граф ревью не роняет: blast-radius пуст, REVIEW_BLAST_REQUIRED=0 (дефолт).
      - name: Build code graph (graphify, pinned)
        if: steps.pr.outputs.run == 'true'
        continue-on-error: true
        working-directory: pr
        env:
          GF: ${{ runner.temp }}/graphify-venv
          GRAPHIFY_OUT: .graphify/graphify-out
          GRAPHIFY_MAX_WORKERS: '4'
          GRAPHIFY_NO_TIPS: '1'
        run: |
          if ! "$GF/bin/graphify" --version >/dev/null 2>&1; then
            rm -rf "$GF"
            python -m venv "$GF"
            "$GF/bin/pip" install --quiet --disable-pip-version-check graphifyy==0.9.87
          fi
          "$GF/bin/graphify" update . --force

      - name: Cache engine cargo build
        if: steps.pr.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/rust/target
          key: engine-cargo-${{ runner.os }}-${{ hashFiles('engine/rust/Cargo.lock') }}-${{ steps.pr.outputs.base }}
          restore-keys: |
            engine-cargo-${{ runner.os }}-${{ hashFiles('engine/rust/Cargo.lock') }}-

      # Бинари в engine/rust/target/debug — первый путь поиска lib/rust-bin.mjs.
      # Сборка не удалась — движок идёт на deprecated JS-копиях (инфра-сбой merge не блокирует).
      - name: Build engine (cargo, base Cargo.lock)
        if: steps.pr.outputs.run == 'true'
        continue-on-error: true
        working-directory: engine/rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked

      - name: Run AI review
        if: steps.pr.outputs.run == 'true'
        working-directory: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr }}
          # Профиль и его вход (AGENTS.md, fpPatterns) движок читает из base.sha через git,
          # а не из чекаута PR (docs/profiles.md, «Доверие»).
          REVIEW_PROFILE: .ai-reviewer.json
          REVIEW_PROFILE_TRUSTED: '1'
          REVIEW_BASE_REF: ${{ steps.pr.outputs.base }}
          # Провайдер и ростер — как у потребителя orakul (OpenRouter с 2026-10-15, замер
          # docs/probe-openrouter-2026-10-14.md). deepseek на effort=low отдаёт пустой ответ — ему
          # none; glm на чанке ~50 КБ рассуждает 3.5–7.5k токенов — бюджет 12000.
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_BASE_URL: https://openrouter.ai/api/v1
          REVIEW_MODE: moa
          MOA_REFERENCE_MODELS: deepseek/deepseek-v4.1-flash,openai/gpt-6-luna
          MOA_SPECIALIST_MODELS: security:z-ai/glm-5.3-flash,correctness:deepseek/deepseek-v4.1-flash,architecture:deepseek/deepseek-v4.1-flash
          LLM_MODEL_SETTINGS: '{"deepseek/deepseek-v4.1-flash":{"effort":"none"},"z-ai/glm-5.3-flash":{"effort":"high","maxTokens":12000},"minimax/minimax-m3.1-flash:free":{"effort":"high"}}'
          MOA_AGGREGATOR: anthropic/claude-haiku-5.5
          MOA_REFERENCE_TEMPERATURE: '0.3'
          MOA_AGGREGATOR_TEMPERATURE: '0.4'
          OLLAMA_MODELS_FALLBACK: openai/gpt-6-luna
          REVIEW_AUTO_TRIAGE: '1'
          REVIEW_INLINE_ON: critical,major
          REVIEW_BLOCK_ON: critical,major
          REVIEW_BLOCK_SINGLE: critical
          REVIEW_CONSENSUS: '1'
          REVIEW_CONFIDENCE_MIN: '0.8'
          REVIEW_VERIFIER: '1'
          REVIEW_VERIFIER_MODEL: 'minimax/minimax-m3.1-flash:free'
          REVIEW_VERIFIER_FALLBACK_MODEL: '~deepseek/deepseek-pro-latest'
          REVIEW_VERIFIER_STRICT: '1'
          REVIEW_ROUTER: '1'
          REVIEW_PRESCAN: '0'
          GRAPHIFY_BIN: ${{ runner.temp }}/graphify-venv/bin/graphify
          GRAPH: .graphify/graphify-out/graph.json
          GRAPHIFY_REPORT: .graphify/graphify-out/GRAPH_REPORT.md
          REVIEW_OBSERVABILITY: '1'
          REVIEW_EXPORT: '1'
          REVIEW_CHUNK_BYTES: '56000'
          REVIEW_CONCURRENCY: '10'
          REVIEW_MAX_CHUNKS: '40'
          REVIEW_LLM_TIMEOUT_MS: '240000'
          REVIEW_TIME_BUDGET_MIN: '20'
          REVIEW_PROVIDER_CONCURRENCY: '12'
          REVIEW_PROVIDER_PER_MODEL: '6'
        run: node "$GITHUB_WORKSPACE/engine/bin/pr-review.mjs"

      - name: Upload review artifacts
        if: always() && steps.pr.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-review-self-${{ steps.pr.outputs.pr }}
          path: |
            pr/.ai-review/observability/
            pr/.ai-review/export/
          if-no-files-found: ignore
          retention-days: 30
